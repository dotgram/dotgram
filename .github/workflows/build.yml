name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # No version here: global.json pins it, so what CI builds with is what the
      # repository says, and changing it is a commit rather than a workflow edit.
      - uses: actions/setup-dotnet@v4

      - run: dotnet restore DotGram.slnx

      # The Linux solution configuration: every project built as Release, minus the
      # two that need the Visual Studio SDK and cannot be built off Windows. Being a
      # solution configuration and not a project one, it still writes to bin/Release,
      # which is why the steps below name Release and mean the same build.
      - name: Build
        run: dotnet build DotGram.slnx --no-restore --configuration Linux -warnaserror

      # The runner names each failure inline -- "failed <test>", its message and its stack --
      # so this step IS the report. A "Show the test log" step used to follow, reading
      # tests/*/bin/Release/*/TestResults/*.log; it printed "No test log" on every red build
      # there has ever been, because Microsoft.Testing.Platform writes no such log and the
      # directory it looked in does not exist. Collecting one needs the TrxReport extension in
      # every test project, which is a change to the projects rather than to CI; it is worth
      # doing the day someone wants failures as an artifact rather than as output.
      - name: Test
        run: dotnet test DotGram.slnx --no-build --configuration Linux

      # The refusal guard reports and never fails, and a report nobody sees on a green run is
      # how a figure comes to circulate without its source. This prints every series' exponent
      # with the commit and machine it was measured on, and keeps the table.
      - name: Show the refusal exponents
        if: always()
        shell: bash
        run: cat tests/DotGram.Tests.Slow/bin/Release/*/RefusalExponents.txt || echo "no RefusalExponents.txt"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: refusal-exponents-linux
          path: tests/DotGram.Tests.Slow/bin/Release/*/RefusalExponents.txt
          if-no-files-found: warn

      - name: Pack
        run: |
          dotnet pack src/DotGram/DotGram.csproj         --no-build --configuration Release --output artifacts
          dotnet pack src/DotGram.Sql/DotGram.Sql.csproj         --no-build --configuration Release --output artifacts
          dotnet pack src/DotGram.Web/DotGram.Web.csproj         --no-build --configuration Release --output artifacts
          dotnet pack src/DotGram.Finance/DotGram.Finance.csproj --no-build --configuration Release --output artifacts
          dotnet pack src/DotGram.ExpressionLanguage/DotGram.ExpressionLanguage.csproj --no-build --configuration Release --output artifacts

      # Each package is the opposite shape of the other, and getting either one wrong
      # is silent: the generator with a lib/ folder would be referenced instead of
      # loaded, and the parsers without one would install and do nothing. The checks
      # themselves are in a script, because `publish.yml` packs again and must run the
      # same ones over the files it is about to send.
      - name: Check the shape of the packages
        shell: bash
        run: .github/scripts/check-packages.sh

      # Everything above builds the generator from source and trusts the package to be
      # the same thing. This is the step that does not: a project whose only connection
      # to this repository is a version on a PackageReference, compiled by the oldest
      # Roslyn the package claims to support, running the parser that came out.
      - name: The package, in somebody else's build
        run: dotnet run --project tests/DotGram.PackageSmoke/DotGram.PackageSmoke.csproj --configuration Release

      # Install .NET 8 explicitly: the net8.0 consumers must run on that runtime,
      # exercising the libraries' netstandard2.0 assets. global.json still selects SDK 10.
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: The library packages, in somebody else's build
        shell: bash
        env:
          NUGET_PACKAGES: ${{ runner.temp }}/dotgram-library-smoke
        run: |
          for library in Sql Web ExpressionLanguage Finance; do
            for framework in net8.0 net10.0; do
              dotnet run --project "tests/DotGram.$library.PackageSmoke/DotGram.$library.PackageSmoke.csproj" --configuration Release --framework "$framework"
            done
          done

      - uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: artifacts/*.nupkg

      # The counters of D144 sit behind a symbol no shipped project defines, so the build
      # above never compiles them. This compiles them once, on all three of Compatibility's
      # targets and at its C# 8 floor, so that the counted variant cannot rot unseen. Last,
      # because it builds over bin/Release, which nothing after it reads.
      - name: The counted variant compiles
        run: dotnet build tests/DotGram.Compatibility/DotGram.Compatibility.csproj --configuration Release -p:DotGramCounts=true -warnaserror

  # The walk's own invariant, compiled in and run over every suite. A reference to a record must
  # name a record the parse HAS, and a reader that followed one it did not have was invisible for
  # the eleven days from v0.1.0: the array it indexes is thread-static and only grows, so a thread
  # that had read something larger absorbed the bad reference and marked an unrelated record as
  # reached, while a cold thread threw. Every suite warms its thread before reaching it, so a green
  # suite said nothing (bd09c013).
  #
  # A job of its own rather than steps in `build`: the runners are free and the jobs go at once, so
  # this costs the wait nothing, and it covers the families where a future grammar could grow a site
  # of this shape — the expression language and Web have none today and are checked anyway.
  checked:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4

      - run: dotnet restore DotGram.slnx

      # And with the generator's cache verified (docs/development.md): a parser taken from what an
      # earlier compilation in the compiler server kept is compiled again and held to the kept one, and
      # a difference, which would be an input of the compile the cache's key does not hold, fails the
      # build with GRAM0001.
      - name: Build with the invariant compiled in
        run: dotnet build DotGram.slnx --no-restore --configuration Linux -p:DotGramChecks=true -p:DotGramVerifyCache=true -warnaserror

      # The build above takes from the cache only where two of its compilations happen to share every
      # input, which proves little. What a user's rebuild after an edit to C# alone does is this, on the
      # largest grammars there are. The first rebuild compiles again whatever the rest of the solution
      # pushed out of the cache's small budget. Then each target framework is rebuilt on its own, so
      # that the report lines it prints are its own, and every one of the three parsers must say it was
      # taken from the cache and verified: a check that verified nothing must not pass.
      - name: The generator's cache, verified on a C#-only rebuild
        shell: bash
        run: |
          build() {
            touch src/DotGram.Sql/SqlWalker.cs
            dotnet build src/DotGram.Sql/DotGram.Sql.csproj --no-restore --configuration Release -p:DotGramChecks=true -p:DotGramVerifyCache=true -warnaserror "$@"
          }
          build
          for framework in net10.0 netstandard2.0; do
            log="$RUNNER_TEMP/verify-cache-$framework.log"
            build --framework "$framework" | tee "$log"
            for host in DotGram.Sql.Standard.Sql92Parser DotGram.Sql.Standard.SqlStandardParser DotGram.Sql.TransactSql.TransactSqlParser; do
              grep -qE "DotGram: $host, .*, cached and verified\$" "$log" || { echo "::error::$host ($framework) was not taken from the cache and verified"; exit 1; }
            done
            reported=$(grep -oE "DotGram: DotGram\.Sql\.[^,]+," "$log" | sort -u | wc -l)
            [ "$reported" -eq 3 ] || { echo "::error::DotGram.Sql ($framework) reported $reported parsers, not 3"; exit 1; }
          done

      # Every suite, snapshots included. The generator writes the check lines only into a compilation
      # that defines the symbol, as this build does; the snapshots are compiled by the test itself
      # with options of their own, so they match here as anywhere — one of them, Tower.Checked, is
      # rendered with the checks on and compiled with the symbol.
      - name: Test with the invariant compiled in
        run: dotnet test DotGram.slnx --no-build --configuration Linux

  # The generator's own output, analysed permanently for dead or redundant emitted code
  # (docs/development.md, "Analysing the generator's own output"). Two halves:
  #
  # - tools/DotGram.GeneratedAnalyzers, our own single-walk analyzer (DGA001 a local copied
  #   into another and never read again, DGA003 a table spelled as code, DGA004 a report-only
  #   allocation inventory), loaded as an ordinary analyzer reference under
  #   DotGramAnalyzeGenerated=true. run-all.sh's own emit.sh step builds with that property AND
  #   -warnaserror, so DGA001 fails this job the same way any other build error does -- no
  #   separate "ordinary build with the property on" step, since the five projects it rebuilds
  #   to emit their generated files are the only ones that reference the analyzer at all.
  # - the stock IDE-prefixed style rules (IDE0059, IDE0060, IDE0051, IDE0052, IDE0004,
  #   IDE0035), which skip generated trees by design (GeneratedCodeAnalysisFlags) and so cannot
  #   be turned on in an ordinary build at all: run-all.sh emits the generated files, compiles
  #   them as an ad-hoc project under their own .editorconfig (which turns the generated-code
  #   skip off for them), and reads the resulting SARIF. The compiler's own CS0168/CS0219/
  #   CS0162 are NOT generated-code-specific and are not part of this: an ordinary
  #   -warnaserror build already enforces them in generated code exactly as it does anywhere
  #   else. SarifGate then gates every one of the six IDE rules the same way, as a count
  #   ratchet against the checked-in ceiling in tools/generated-analysis/counts.txt (one line
  #   per package x rule) rather than a fixed enforced/report-only split: it fails on ANY
  #   difference from that file, in either direction -- an increase is the regression this
  #   exists to catch, and an unrecorded decrease would only leave the ceiling looser than
  #   reality. A `#pragma`-suppressed finding, and one in the grammar author's own file rather
  #   than the copied emitted text, are both excluded from the count; SarifGate also fails
  #   first, before trusting any count, on a "level":"error" result (the analysis project
  #   itself did not compile).
  #
  # A new job rather than a step of `build`: this is the whole reason DotGramAnalyzeGenerated
  # exists rather than turning the property on everywhere -- an ordinary build and the IDE
  # never pay for this, only this one required job does, on every push. Not in publish.yml.
  generated-analysis:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4

      - run: dotnet restore DotGram.slnx

      - name: Emit the generated files and analyse each package's own output under the stock rules
        run: tools/generated-analysis/run-all.sh . /tmp/generated-analysis

      - name: The pragma inventory -- fails on a new #pragma the generator did not have before
        run: tools/generated-analysis/pragma-inventory.sh check /tmp/generated-analysis/emit tools/generated-analysis/pragma-inventory.txt

      - name: The count ratchet -- fails if any (package, rule) total differs from the checked-in ceiling
        run: |
          dotnet build tools/generated-analysis/SarifGate/SarifGate.csproj --configuration Release -nodeReuse:false
          dotnet tools/generated-analysis/SarifGate/bin/Release/net10.0/SarifGate.dll \
            check tools/generated-analysis/counts.txt \
            /tmp/generated-analysis/sarif/Sql.sarif /tmp/generated-analysis/sarif/Web.sarif \
            /tmp/generated-analysis/sarif/Finance.sarif /tmp/generated-analysis/sarif/ExpressionLanguage.sarif \
            /tmp/generated-analysis/sarif/Examples.sarif

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: generated-analysis-sarif
          path: /tmp/generated-analysis/sarif/*.sarif
          if-no-files-found: warn

  # The development machine is Linux (it was Windows until 2026-09), and a repository
  # built on one system hides a path separator or a line ending until somebody clones it
  # on the other. This does not prove what the job above proves. It is the only one that builds the
  # Visual Studio extension, which ships; it is the only one that can fail on a name
  # Windows keeps or a character it forbids; and the one above is the only one that can
  # fail on the character Windows forbids and Linux does not. Both directions have
  # caught something, so both run on every push — the runners are free to a public
  # repository and the two go at once, which costs the wait and nothing else.
  windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4

      - run: dotnet restore DotGram.slnx

      - name: Build
        run: dotnet build DotGram.slnx --no-restore --configuration Release -warnaserror

      - name: Test
        run: dotnet test DotGram.slnx --no-build --configuration Release

      - name: Show the refusal exponents
        if: always()
        shell: bash
        run: cat tests/DotGram.Tests.Slow/bin/Release/*/RefusalExponents.txt || echo "no RefusalExponents.txt"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: refusal-exponents-windows
          path: tests/DotGram.Tests.Slow/bin/Release/*/RefusalExponents.txt
          if-no-files-found: warn

      # The third artifact of the tag, and the only one that cannot be built above.
      - name: Check the extension was built
        shell: bash
        run: |
          vsix=$(find src/DotGram.VisualStudio/bin/Release -name '*.vsix' | head -1)
          test -n "$vsix" || { echo "no .vsix was produced"; exit 1; }
          echo "built $vsix"
          echo "VSIX=$vsix" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: ${{ env.VSIX }}
