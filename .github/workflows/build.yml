name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # No version here: global.json pins it, so what CI builds with is what the
      # repository says, and changing it is a commit rather than a workflow edit.
      - uses: actions/setup-dotnet@v4

      - run: dotnet restore DotGram.slnx

      - name: Build
        run: dotnet build DotGram.slnx --no-restore --configuration Release -warnaserror

      - name: Test
        run: dotnet test DotGram.slnx --no-build --configuration Release

      # The runner names the failures in a log it leaves behind, and a test step that
      # cannot tell you what broke is only half a test step.
      - name: Show the test log
        if: failure()
        run: cat tests/DotGram.Tests/bin/Release/net10.0/TestResults/*.log

      - name: Pack
        run: dotnet pack src/DotGram/DotGram.csproj --no-build --configuration Release --output artifacts

      # The package ships one assembly, in the analyzer folder, and nothing in lib/.
      # A stray lib/ entry would make consumers reference the generator instead of
      # loading it — the failure would surface as a mysterious dependency, not here.
      - name: Check the shape of the package
        shell: bash
        run: |
          cd artifacts
          unzip -o -q *.nupkg -d contents
          cd contents
          test -f analyzers/dotnet/cs/DotGram.dll || { echo "analyzer assembly missing"; exit 1; }
          test -f README.md                      || { echo "readme missing";            exit 1; }
          if [ -d lib ]; then echo "package has a lib/ folder:"; find lib -type f; exit 1; fi

      - uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: artifacts/*.nupkg

  # The development machine is Windows and CI is not, which is the arrangement that
  # hides a path separator or a line ending until somebody else clones the repository.
  # Not on every push: this build proves the same thing the one above does, on the
  # platform where file names, separators and CRLF behave differently.
  windows:
    if: github.event_name != 'push'
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4

      - run: dotnet restore DotGram.slnx

      - name: Build
        run: dotnet build DotGram.slnx --no-restore --configuration Release -warnaserror

      - name: Test
        run: dotnet test DotGram.slnx --no-build --configuration Release
