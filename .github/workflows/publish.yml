name: publish

# A release is a tag. Pushing `v0.2.0` builds the repository at that commit, checks that the
# tag and the version in Directory.Build.props are the same thing, packs the five packages and
# publishes them. Everything up to the push happens whether or not the account's API key is
# configured: without it the packages are still built, checked and uploaded as artifacts of the
# run, so a dry run is the same run with the last step skipped.
#
# It does not build the Visual Studio extension: that is Windows, and the VSIX goes to the
# Marketplace by hand from the `windows` job's artifact of the same commit.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # No version here either: global.json pins the SDK, as in the build workflow.
      - uses: actions/setup-dotnet@v4

      - run: dotnet restore DotGram.slnx

      # The Linux solution configuration: every project built as Release, minus the two that need
      # the Visual Studio SDK and cannot be built off Windows. Being a solution configuration and
      # not a project one, it still writes to bin/Release, which is why the steps below name
      # Release and mean this same build. It is worth saying here as well as in build.yml: this is
      # the workflow where building one thing and packing another would send the wrong bits.
      - name: Build
        run: dotnet build DotGram.slnx --no-restore --configuration Linux -warnaserror

      - name: Test
        run: dotnet test DotGram.slnx --no-build --configuration Linux

      # A tag that says one version and a package that says another is the one mistake this
      # workflow can make that nobody can take back, so it is checked before anything is packed.
      - name: The tag is the version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          tagged="${GITHUB_REF_NAME#v}"
          packed=$(grep -oP '(?<=<Version>)[^<]+' Directory.Build.props)
          if [ "$tagged" != "$packed" ]; then
            echo "The tag says $tagged and Directory.Build.props says $packed."; exit 1
          fi

      - name: Pack
        run: |
          dotnet pack src/DotGram/DotGram.csproj         --no-build --configuration Release --output artifacts
          dotnet pack src/DotGram.Sql/DotGram.Sql.csproj         --no-build --configuration Release --output artifacts
          dotnet pack src/DotGram.Web/DotGram.Web.csproj         --no-build --configuration Release --output artifacts
          dotnet pack src/DotGram.Finance/DotGram.Finance.csproj --no-build --configuration Release --output artifacts
          dotnet pack src/DotGram.ExpressionLanguage/DotGram.ExpressionLanguage.csproj --no-build --configuration Release --output artifacts

      # What `build.yml` does between packing and keeping, done here too, and for the reason the
      # gate cannot cover: that workflow proves a pack passed, and this one packs AGAIN and sends
      # what it packed. A branch rule would say some pack was checked, not that this one was. So
      # the files that are about to leave are the files that are checked, and a failure here means
      # nothing is uploaded and nothing is pushed.
      - name: Check the shape of the packages
        shell: bash
        run: .github/scripts/check-packages.sh

      - name: The package, in somebody else's build
        run: dotnet run --project tests/DotGram.PackageSmoke/DotGram.PackageSmoke.csproj --configuration Release

      # Required rather than tidy: the library smokes run on net8.0 as well as net10.0, and this
      # job installs one SDK. Without it those legs fail on a clean runner — or pass on one that
      # happens to have .NET 8 already, which is the kind of green that means nothing. global.json
      # still selects SDK 10 for everything else.
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: The library packages, in somebody else's build
        shell: bash
        env:
          NUGET_PACKAGES: ${{ runner.temp }}/dotgram-library-smoke
        run: |
          for library in Sql Web ExpressionLanguage Finance; do
            for framework in net8.0 net10.0; do
              dotnet run --project "tests/DotGram.$library.PackageSmoke/DotGram.$library.PackageSmoke.csproj" --configuration Release --framework "$framework"
            done
          done

      - uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: artifacts/*.nupkg

      # The only step that leaves the machine. It is skipped until the repository has the
      # account's API key as a secret, so this workflow can be run and read before it can
      # publish anything. `--skip-duplicate` makes a re-run of a finished release harmless.
      - name: Push to nuget.org
        if: env.NUGET_API_KEY != ''
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: >
          dotnet nuget push 'artifacts/*.nupkg'
          --api-key "$NUGET_API_KEY"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
