name: publish

# A release is a tag. Pushing `v0.2.0` builds the repository at that commit, checks that the
# tag and the version in Directory.Build.props are the same thing, packs the five packages and
# publishes them. Everything up to the push happens on a manual run too: without a tag the
# packages are still built, checked and uploaded as artifacts of the run, so a dry run is the
# same run with the last job left off.
#
# It does not build the Visual Studio extension: that is Windows, and the VSIX goes to the
# Marketplace by hand from the `windows` job's artifact of the same commit.
#
# Nothing here holds a nuget.org key. The `publish` job asks GitHub for a short-lived OIDC token,
# nuget.org checks it against a trusted publishing policy naming this repository and this file,
# and hands back an API key that lives one hour. The repository therefore has no secret to leak,
# to rotate, or to forget to set — which is why the key is requested in the last job, seconds
# before it is used, rather than at the top of a run whose tests and package smokes take a while.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Everything that can be checked without leaving the machine. It runs for a manual dispatch as
  # well as for a tag, and it is the whole of a dry run.
  pack:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # No version here either: global.json pins the SDK, as in the build workflow.
      - uses: actions/setup-dotnet@v4

      - run: dotnet restore DotGram.slnx

      # The Linux solution configuration: every project built as Release, minus the two that need
      # the Visual Studio SDK and cannot be built off Windows. Being a solution configuration and
      # not a project one, it still writes to bin/Release, which is why the steps below name
      # Release and mean this same build. It is worth saying here as well as in build.yml: this is
      # the workflow where building one thing and packing another would send the wrong bits.
      - name: Build
        run: dotnet build DotGram.slnx --no-restore --configuration Linux -warnaserror

      - name: Test
        run: dotnet test DotGram.slnx --no-build --configuration Linux

      # A tag that says one version and a package that says another is the one mistake this
      # workflow can make that nobody can take back, so it is checked before anything is packed.
      - name: The tag is the version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          tagged="${GITHUB_REF_NAME#v}"
          packed=$(grep -oP '(?<=<Version>)[^<]+' Directory.Build.props)
          if [ "$tagged" != "$packed" ]; then
            echo "The tag says $tagged and Directory.Build.props says $packed."; exit 1
          fi

      - name: Pack
        run: |
          dotnet pack src/DotGram/DotGram.csproj         --no-build --configuration Release --output artifacts
          dotnet pack src/DotGram.Sql/DotGram.Sql.csproj         --no-build --configuration Release --output artifacts
          dotnet pack src/DotGram.Web/DotGram.Web.csproj         --no-build --configuration Release --output artifacts
          dotnet pack src/DotGram.Finance/DotGram.Finance.csproj --no-build --configuration Release --output artifacts
          dotnet pack src/DotGram.ExpressionLanguage/DotGram.ExpressionLanguage.csproj --no-build --configuration Release --output artifacts

      # What `build.yml` does between packing and keeping, done here too, and for the reason the
      # gate cannot cover: that workflow proves a pack passed, and this one packs AGAIN and sends
      # what it packed. A branch rule would say some pack was checked, not that this one was. So
      # the files that are about to leave are the files that are checked, and a failure here means
      # nothing is uploaded and nothing is pushed.
      - name: Check the shape of the packages
        shell: bash
        run: .github/scripts/check-packages.sh

      - name: The package, in somebody else's build
        run: dotnet run --project tests/DotGram.PackageSmoke/DotGram.PackageSmoke.csproj --configuration Release

      # Required rather than tidy: the library smokes run on net8.0 as well as net10.0, and this
      # job installs one SDK. Without it those legs fail on a clean runner — or pass on one that
      # happens to have .NET 8 already, which is the kind of green that means nothing. global.json
      # still selects SDK 10 for everything else.
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: The library packages, in somebody else's build
        shell: bash
        env:
          NUGET_PACKAGES: ${{ runner.temp }}/dotgram-library-smoke
        run: |
          for library in Sql Web ExpressionLanguage Finance; do
            for framework in net8.0 net10.0; do
              dotnet run --project "tests/DotGram.$library.PackageSmoke/DotGram.$library.PackageSmoke.csproj" --configuration Release --framework "$framework"
            done
          done

      - uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: artifacts/*.nupkg

  # The only job that leaves the machine, and everything about it is a gate.
  #
  # It runs only for a tag. That condition used to share the work with "unless the API key is
  # missing", which was never a decision — the key had simply never been set, and a check that
  # holds only because somebody forgot something stops holding on the day they remember. So the
  # second gate is now a real one: the `release` environment. An environment that does not exist
  # yet is created on first use with no rules, and required reviewers can be added to it in the
  # repository's settings afterwards, at which point a release waits for a person.
  #
  # It packs nothing. It takes the files the job above checked, byte for byte, which is the same
  # argument as packing in this workflow rather than trusting another one's pack: what leaves is
  # what was checked, and there is no second build in between for them to differ across.
  publish:
    needs: pack
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    environment: release

    permissions:
      contents: read
      id-token: write   # lets this job ask GitHub for the OIDC token nuget.org will verify

    steps:
      # A checkout for global.json alone: it pins the SDK, and this job would otherwise push with
      # whatever .NET the runner image happens to carry. Naming a version here instead would move
      # that decision out of the repository, which is what global.json exists to prevent.
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4

      - uses: actions/download-artifact@v4
        with:
          name: nupkg
          path: artifacts

      # Pinned by commit rather than by tag. A tag is a name its owner can move, and this is the
      # one action in the repository that mints a credential able to publish under our name.
      - name: NuGet login (OIDC, for a key that lives an hour)
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841   # v1
        with:
          user: ${{ secrets.NUGET_USER }}

      # `--skip-duplicate` makes a re-run of a finished release harmless: a version already on
      # nuget.org is left alone rather than failing the job.
      - name: Push to nuget.org
        run: >
          dotnet nuget push 'artifacts/*.nupkg'
          --api-key "${{ steps.login.outputs.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
